apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-migration
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-database
  interval: 10m
  path: ./apps/migration
  prune: false
  retryInterval: 1m
  serviceAccountName: flux-platform-migration-reconciler
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-apps
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-migration
    - name: cert-manager-config
  interval: 10m
  path: ./apps
  prune: true
  retryInterval: 1m
  serviceAccountName: flux-platform-app-reconciler
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  wait: true
