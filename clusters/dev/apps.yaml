apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-database
  interval: 10m
  path: ./apps
  prune: true
  retryInterval: 1m
  serviceAccountName: flux-platform-reconciler
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true
