apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/part-of: engineering-platform
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
    platform.unif.internal/environment: dev
  name: openbao
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-openbao-reconciler
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-kustomization-impersonation
  namespace: flux-system
rules:
  - apiGroups:
      - ''
    resourceNames:
      - flux-openbao-reconciler
    resources:
      - serviceaccounts
    verbs:
      - impersonate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-kustomization-impersonation
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-kustomization-impersonation
subjects:
  - kind: ServiceAccount
    name: kustomize-controller
    namespace: flux-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-openbao-reconciler
