apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-controller-api-health
rules:
  - nonResourceURLs:
      - /livez/ping
    verbs:
      - head
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-controller-api-health
roleRef:
  apiGroup: rbac.authorization.k8s.io
