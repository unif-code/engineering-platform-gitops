apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-postgres-ingress
  namespace: platform
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: platform
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - backend
                  - platform-migration
      ports:
        - port: 5432
          protocol: TCP
