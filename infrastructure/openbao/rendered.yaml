# Source: openbao/templates/server-serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: openbao
  labels:
    helm.sh/chart: openbao-0.28.6
    app.kubernetes.io/name: openbao
    app.kubernetes.io/instance: openbao
