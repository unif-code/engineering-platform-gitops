# Source: openbao/templates/server-config-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
  namespace: openbao
  labels:
    helm.sh/chart: openbao-0.28.6
    app.kubernetes.io/name: openbao
    app.kubernetes.io/instance: openbao
    app.kubernetes.io/managed-by: Helm
data:
  extraconfig-from-values.hcl: |-

    ui = false
    disable_mlock = true
    api_addr = "https://openbao.openbao.svc:8200"
    cluster_addr = "https://openbao-0.openbao-internal.openbao.svc.cluster.local:8201"

    listener "tcp" {
      address = "[::]:8200"
      cluster_address = "[::]:8201"
      tls_disable = 0
      tls_cert_file = "/openbao/userconfig/openbao-server-tls/tls.crt"
      tls_key_file = "/openbao/userconfig/openbao-server-tls/tls.key"
    }

    storage "raft" {
      path = "/openbao/data"
    }

    service_registration "kubernetes" {}

    audit "file" "to-file" {
      description = "Persistent DEV OpenBao audit log."
      options {
        file_path = "/openbao/audit/openbao-audit.log"
        hmac_accessor = "true"
        log_raw = "false"
        mode = "0600"
      }
    }

    audit "file" "to-stdout" {
      description = "Container stdout OpenBao audit stream."
      options {
        file_path = "stdout"
        hmac_accessor = "true"
        log_raw = "false"
      }
    }
