apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    app.kubernetes.io/part-of: engineering-platform
    platform.unif.internal/environment: dev
  name: openbao
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./vendor/charts/openbao
      interval: 24h
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      version: 0.28.6
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  interval: 30m
  releaseName: openbao
  serviceAccountName: helm-openbao-reconciler
  storageNamespace: openbao
  targetNamespace: openbao
  timeout: 15m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: openbao-helm-values
      valuesKey: values.yaml
