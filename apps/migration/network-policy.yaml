apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-migration-egress
  namespace: platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-migration
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: TCP
        - port: 53
          protocol: UDP
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: platform
      ports:
        - port: 5432
          protocol: TCP
