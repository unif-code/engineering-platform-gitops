apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform
  namespace: platform
spec:
  hostnames:
    - platform.dev.local
  parentRefs:
    - name: platform-gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 8000
    - matches:
        - path:
            type: Exact
            value: /healthz
        - path:
            type: Exact
            value: /readyz
      backendRefs:
        - name: backend
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
